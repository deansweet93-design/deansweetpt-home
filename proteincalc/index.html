  html,body{ margin:0; padding:0; background:var(--cream); color:var(--ink); }
  body{ font-family:'Space Grotesk',sans-serif; overflow-x:hidden; }
  .dp-root{ min-height:100svh; padding:30px 20px calc(44px + env(safe-area-inset-bottom));

  .dp-wrap{ width:100%; max-width:520px; }

  .dp-btn{ background:var(--lime); color:var(--ink); border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    letter-spacing:0; padding:16px 22px; border-radius:14px; width:100%;
    cursor:pointer; transition:transform .12s ease, background .12s ease; min-height:54px; }
  .dp-btn:hover{ transform:translateY(-1px); background:#c7ef00; }
  .dp-btn:active{ transform:translateY(0); }
  .dp-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  a.dp-btn{ display:block; text-align:center; text-decoration:none; line-height:1.2; }
  /* dark button variant (used on the lime CTA block) */
  .dp-btn.dark{ background:var(--ink); color:var(--cream); }
  .dp-btn.dark:hover{ background:#222; }
  .dp-ghost{ background:transparent; color:var(--muted); border:none; cursor:pointer;
    font-size:13px; padding:12px; margin-top:6px; font-family:'Space Grotesk',sans-serif;
    font-weight:500; min-height:44px; }
  .dp-ghost:hover{ color:var(--ink); }

  /* cards */
  .dp-card{ background:var(--band); border:1px solid var(--border); border-radius:16px;
    padding:18px; margin-bottom:12px; }
  .dp-label{ font-family:'Archivo Black',sans-serif; font-weight:400; font-size:20px;

  .dp-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }

  .dp-input{ width:100%; background:#fbfaf6; border:1px solid var(--border); color:var(--ink);
    border-radius:14px; padding:16px 18px; font-size:16px; font-family:'Space Grotesk',sans-serif;
    margin-bottom:16px; min-height:54px; }
  .dp-input::placeholder{ color:var(--soft); }
  .dp-input:focus{ outline:none; border-color:var(--ink); }

  /* selectable options */
  .dp-opt{ background:var(--band); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-bottom:10px; cursor:pointer; transition:all .12s ease; }
  .dp-opt:hover{ border-color:rgba(10,10,10,0.3); }
  .dp-opt.on{ border-color:var(--ink); background:#fbfaf6;

  .dp-opt .ttl{ font-family:'Archivo Black',sans-serif; font-weight:400; font-size:19px;

  .dp-opt .ds{ color:var(--muted); font-size:13px; margin-top:2px; }

  .dp-weightval{ font-family:'Archivo Black',sans-serif; font-weight:400; font-size:52px;
    color:var(--ink); line-height:1; letter-spacing:-0.02em; }

  /* sliders */
  .dp-slider{ -webkit-appearance:none; appearance:none; width:100%; height:5px;

  .dp-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px;

  .dp-slider::-moz-range-thumb{ width:26px; height:26px; border-radius:50%;

  .dp-stepbtn:hover{ border-color:var(--ink); }
  .dp-stepnum{ font-family:'Archivo Black',sans-serif; font-weight:400; font-size:34px;

  .dp-mealrow .mt{ font-family:'Archivo Black',sans-serif; font-weight:400; font-size:15px;
    color:var(--soft); min-width:32px; }
  .dp-segs{ display:flex; gap:6px; flex-wrap:wrap; }
  .dp-seg{ border:1px solid var(--border); background:#fbfaf6; color:var(--muted);

  .dp-seg.on{ border-color:var(--ink); background:var(--lime); color:var(--ink); font-weight:700; }

  .dp-prog{ display:flex; gap:6px; margin-bottom:26px; }
  .dp-prog span{ height:3px; flex:1; border-radius:4px; background:rgba(10,10,10,0.12); }

  .dp-pillrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .dp-pill{ border:1px solid var(--border); background:var(--band); color:var(--ink);

  .dp-mini{ background:transparent; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif;

  @media print{

</style>

  {id:"fatloss",label:"Lose fat, keep muscle", sub:"The one most people want", mult:2.0},
  {id:"muscle", label:"Build muscle",          sub:"Actually put size on",     mult:2.2}

var AVOIDS = [
  {id:"red",    label:"No red meat"},
  {id:"meat",   label:"No meat at all"},
  {id:"seafood",label:"No seafood"},
  {id:"dairy",  label:"No dairy"},
  {id:"egg",    label:"No eggs"}
];
function dropsFood(avoidId, f){
  if(avoidId==="red")     return f.tags.indexOf("red")>-1;
  if(avoidId==="meat")    return f.tags.indexOf("meat")>-1;
  if(avoidId==="seafood") return f.tags.indexOf("seafood")>-1;
  if(avoidId==="dairy")   return f.tags.indexOf("dairy")>-1;
  if(avoidId==="egg")     return f.tags.indexOf("egg")>-1;
  return false;
}
var MEAL_LABELS = ["breakfast","lunch","dinner"];

var S = {
  step:0, fname:"", email:"", weight:80, goal:"fatloss",
  meals:3, snacks:1, mealLabels:["breakfast","lunch","dinner"],
  avoid:[], swaps:{}, amounts:{},
  shopDays:7, rankMode:null, rankAll:false,
  variety:"some", rotSwaps:{}
};

function round5(n){ return Math.round(n/5)*5; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function defaultLabel(i,n){ return i===0 ? "breakfast" : (i===n-1 ? "dinner" : "lunch"); }
function poolFor(label){ return label==="breakfast" ? "breakfast" : "main"; }
function fmtAmt(amt, unit){
  if(unit==="g") return amt+"g";
  var sing = {eggs:"egg",scoops:"scoop",cups:"cup",tins:"tin",bars:"bar",servings:"serving"};
  return amt+" "+(amt===1 && sing[unit] ? sing[unit] : unit);
}
function target(){ var g=GOALS.filter(function(x){return x.id===S.goal;})[0]; return round5(S.weight*g.mult); }
function perMeal(){ return round5(target()/(S.meals + S.snacks*0.5)); }
function perSnack(){ return round5(perMeal()*0.5); }
function allowed(){
  return PROTEINS.filter(function(f){
    return !S.avoid.some(function(a){ return dropsFood(a,f); });
  });
}
function optBy(slotType, aim){
  return allowed().filter(function(f){ return f.slot===slotType; })
    .sort(function(a,b){ return Math.abs(a.protein-aim)-Math.abs(b.protein-aim); });
}
function pickFood(key, opts, idx){
  if(!opts.length) return null;
  return opts[(idx + (S.swaps[key]||0)) % opts.length];
}
function buildSlots(){
  var out=[], i, bf=optBy("breakfast",perMeal()), mn=optBy("main",perMeal()), sk=optBy("snack",perSnack());
  for(i=0;i<S.meals;i++){
    var label = S.mealLabels[i] || defaultLabel(i,S.meals);
    var opts = poolFor(label)==="breakfast" ? bf : mn;
    out.push({key:"meal-"+i, label:cap(label), food:pickFood("meal-"+i, opts, i)});
  }
  for(i=0;i<S.snacks;i++){
    out.push({key:"snack-"+i, label:"Snack "+(i+1), food:pickFood("snack-"+i, sk, i)});
  }
  return out;
}
function getAmt(key, food){ return S.amounts[key]!==undefined ? S.amounts[key] : food.baseAmt; }
function getProtein(key, food){ return Math.round(getAmt(key,food)*food.protein/food.baseAmt); }
function planTotal(){
  return buildSlots().reduce(function(sum,s){ return s.food ? sum+getProtein(s.key,s.food) : sum; },0);
}
function syncMealLabels(){
  var arr=[], i;
  for(i=0;i<S.meals;i++) arr.push(S.mealLabels[i] || defaultLabel(i,S.meals));
  S.mealLabels = arr;
}

function rankMode(){ return S.rankMode || (S.goal==="fatloss" ? "lean" : "serve"); }
function per100(f){ return Math.round(f.p/f.k*100); }
function rankedList(){
  var m = rankMode();

    return !S.avoid.some(function(a){ return dropsFood(a, {tags:f.t}); });

  if(m==="nocook") list = list.filter(function(f){ return f.nc; });
  list.sort(m==="serve"
    ? function(a,b){ return b.p-a.p || per100(b)-per100(a); }
    : function(a,b){ return (b.p/b.k)-(a.p/a.k); });

function fmtQty(it, q){
  if(it.u==="g"){
    var g = Math.ceil(q/50)*50, s = g>=1000 ? (Math.round(g/100)/10)+"kg" : g+"g";
    if(it.pack){ var n = Math.ceil(q/it.pack - 1e-9); s += " ("+n+" × "+it.packName+(n>1?"s":"")+")"; }
    return s;
  }
  var c = Math.ceil(q - 1e-9);
  if(it.u==="egg")   return c>=12 ? c+" ("+Math.ceil(c/12)+" dozen)" : String(c);
  if(it.u==="tin")   return c+" tin"+(c===1?"":"s");
  if(it.u==="scoop") return c+" scoop"+(c===1?"":"s")+" (about "+(c*30)+"g)";
  if(it.u==="bar")   return c+" bar"+(c===1?"":"s");
  return String(c);
}
/* ---------- a varied week ---------- */
// How many different proteins each meal rotates through, by variety level.
var VARIETY = {
  simple: {label:"Keep it simple", breakfast:1, lunch:2, dinner:2, snack:1},
  some:   {label:"Some variety",   breakfast:2, lunch:2, dinner:3, snack:2},
  lots:   {label:"Mix it up",      breakfast:3, lunch:3, dinner:4, snack:3}
};
var DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// Amount of a food that gives roughly this much protein, snapped to its slider steps.
function amtFor(food, protein){
  var a = protein / (food.protein / food.baseAmt);
  a = Math.round(a / food.amtStep) * food.amtStep;
  a = Math.min(food.amtMax, Math.max(food.amtMin, a));
  return Math.round(a * 100) / 100;
}
function slotKind(s){ return s.key.indexOf("snack")===0 ? "snack" : s.label.toLowerCase(); }

// For each meal: the food they picked first, then alternatives with similar protein.
function rotations(){
  var slots = buildSlots(), v = VARIETY[S.variety] || VARIETY.some, usedMain = {};
  slots.forEach(function(s){ if(s.food && s.food.slot==="main") usedMain[s.food.name] = 1; });
  return slots.map(function(s){
    if(!s.food) return {slot:s, items:[], more:false};
    var n = v[slotKind(s)] || 1, aim = getProtein(s.key, s.food);
    var items = [{food:s.food, amt:getAmt(s.key, s.food)}];
    var pool = optBy(s.food.slot, aim).filter(function(f){ return f.name !== s.food.name; });
    if(s.food.slot==="main"){
      // prefer mains that aren't already someone else's pick, so lunch and dinner differ
      pool = pool.filter(function(f){ return !usedMain[f.name]; })
                 .concat(pool.filter(function(f){ return usedMain[f.name]; }));
    }
    var shift = S.rotSwaps[s.key] || 0, i = 0, guard = 0;
    while(items.length < n && pool.length && guard < pool.length){
      var f = pool[(i + shift) % pool.length]; i++; guard++;
      if(items.some(function(x){ return x.food.name === f.name; })) continue;
      items.push({food:f, amt:amtFor(f, aim)});
      if(f.slot==="main") usedMain[f.name] = 1;
    }
    return {slot:s, items:items, more: pool.length > items.length - 1};
  });
}

// Day by day: each meal cycles through its rotation; lunch and dinner avoid doubling up.
function weekPlan(){
  var rots = rotations(), plan = [], d;
  for(d = 0; d < S.shopDays; d++){
    var day = {name:DAY_NAMES[d], meals:[]}, mainsToday = {};
    rots.forEach(function(r){
      if(!r.items.length) return;
      var len = r.items.length, k = d % len, it = r.items[k], tries = 0;
      while(it.food.slot==="main" && mainsToday[it.food.name] && tries < len){ k = (k+1) % len; it = r.items[k]; tries++; }
      if(it.food.slot==="main") mainsToday[it.food.name] = 1;
      day.meals.push({key:r.slot.key, label:r.slot.label, food:it.food, amt:it.amt});
    });
    plan.push(day);
  }
  return plan;
}

// The week grouped by meal: which food, how much, which days.
function weekSummary(){
  var rots = rotations(), plan = weekPlan();
  return rots.filter(function(r){ return r.items.length; }).map(function(r){
    var rows = r.items.map(function(it){
      var days = plan.filter(function(day){
        return day.meals.some(function(m){ return m.key===r.slot.key && m.food.name===it.food.name; });
      }).map(function(day){ return day.name; });
      return {food:it.food, amt:it.amt, days:days};
    }).filter(function(row){ return row.days.length; });
    return {key:r.slot.key, label:r.slot.label, rows:rows, more:r.more};
  });
}
function daysText(days){ return (days.length===S.shopDays && days.length>2) ? "Every day" : days.join(", "); }
function proteinFor(food, amt){ return Math.round(amt * food.protein / food.baseAmt); }
function weekHTML(){
  var sum = weekSummary(), h = '<div class="dp-week">';
  if(!sum.length) return '<p class="dp-hint">Nothing planned yet.</p>';
  sum.forEach(function(g){
    h += '<div class="dp-wslot"><div class="dp-wtop"><span class="slot-lbl">'+g.label+'</span>'
       + (g.more && VARIETY[S.variety][slotKind({key:g.key,label:g.label})] > 1
          ? '<button class="dp-mini" onclick="onRotSwap(\''+g.key+'\')">&#8635; Other options</button>' : '')
       + '</div><ul>';
    g.rows.forEach(function(row){
      h += '<li><span class="wf">'+row.food.name+'<em>'+fmtAmt(row.amt,row.food.amtUnit)+', '+proteinFor(row.food,row.amt)+'g protein</em></span>'
         + '<span class="wd">'+daysText(row.days)+'</span></li>';
    });
    h += '</ul></div>';

  return h + '</div>';
}

function onVariety(id){ S.variety = id; S.rotSwaps = {}; refreshShop(); }
function onRotSwap(key){ S.rotSwaps[key] = (S.rotSwaps[key] || 0) + 1; refreshShop(); }

function shoppingList(){
  var tot = {};
  weekPlan().forEach(function(day){
    day.meals.forEach(function(m){
      var parts = SHOP[m.food.name]; if(!parts) return;
      parts.forEach(function(p){ tot[p.k] = (tot[p.k]||0) + m.amt*p.x; });
    });
  });
  var groups = {};
  Object.keys(tot).forEach(function(k){
    var it = ITEMS[k];
    (groups[it.a] = groups[it.a] || []).push({n:it.n, q:fmtQty(it, tot[k])});
  });
  return AISLES.filter(function(a){ return groups[a]; })
               .map(function(a){ return {aisle:a, items:groups[a]}; });
}
function shopHTML(){
  var groups = shoppingList(), h = "";
  if(!groups.length) return '<p class="dp-hint" style="margin:10px 0">Nothing to buy yet.</p>';
  groups.forEach(function(g){
    h += '<div class="dp-aisle"><div class="slot-lbl">'+g.aisle+'</div><ul>';
    g.items.forEach(function(i){ h += '<li><span>'+i.n+'</span><strong>'+i.q+'</strong></li>'; });
    h += '</ul></div>';
  });
  return h;
}
function shoppingText(){
  var t = "My protein week ("+S.shopDays+" day"+(S.shopDays===1?"":"s")+")\n";
  weekSummary().forEach(function(g){
    t += "\n"+g.label+"\n";
    g.rows.forEach(function(r){ t += "- "+r.food.name+", "+fmtAmt(r.amt,r.food.amtUnit)+": "+daysText(r.days)+"\n"; });
  });
  t += "\nShopping list\n";
  shoppingList().forEach(function(g){
    t += "\n"+g.aisle+"\n";
    g.items.forEach(function(i){ t += "- "+i.n+": "+i.q+"\n"; });

}

function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
}
function copyShop(){
  var txt = shoppingText();
  var done = function(){
    var b = document.getElementById("copyBtn");
    if(b){ b.textContent = "Copied. Paste it into your notes"; setTimeout(function(){ b.textContent = "Copy my week and shopping list"; }, 2200); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}
function shareShop(){
  if(navigator.share){ navigator.share({title:"My protein week", text:shoppingText()}).catch(function(){}); }
  else copyShop();
}

/* ---------- email submit (MailerLite or no-op) ---------- */
function submitEmail(){
  // Fire the subscribe to our own endpoint, then move on regardless so a
  // network hiccup never traps the user before they see their plan.
  var payload = JSON.stringify({ email: S.email, name: S.fname });
  try {
    fetch(SUBSCRIBE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: payload
    }).then(function(r){
      if(!r.ok){ console.warn("subscribe failed", r.status); }
    }).catch(function(e){ console.warn("subscribe error", e); });
  } catch(e){ console.warn("subscribe threw", e); }
  go(2);
}

/* ---------- render ---------- */
function go(n){ S.step=n; render(); window.scrollTo(0,0); }
function back(){ go(Math.max(0,S.step-1)); }
function restart(){ S.step=0; S.swaps={}; S.amounts={}; render(); window.scrollTo(0,0); }

function progDots(){
  if(S.step<1 || S.step>4) return "";
  var h='<div class="dp-prog">';
  [1,2,3,4].forEach(function(n){ h+='<span class="'+(S.step>=n?"on":"")+'"></span>'; });
  return h+"</div>";
}

function render(){
  var app=document.getElementById("app"), h=progDots();

  if(S.step===0){
    h+='<div class="dp-kicker">Free &middot; takes about a minute</div>'
     +'<h1 class="dp-h1">How much protein do you <em>actually</em> need?</h1>'
     +'<p class="dp-sub">No app to download. No calorie tracking for the rest of your life. Just your number, proteins to hit it, meal ideas, a shopping list for the week, and the best protein sources ranked. Adjust portions with the slider. Swap anything you don\'t like.</p>'
     +'<button class="dp-btn" onclick="go(1)">Build my protein plan &rarr;</button>';
  }

  else if(S.step===1){
    h+='<div class="dp-kicker">Step 1 of 4</div>'
     +'<h1 class="dp-h1">Where do we send it?</h1>'

     +'<input class="dp-input" type="text" id="fnameIn" placeholder="First name" value="'+S.fname.replace(/"/g,"&quot;")+'" oninput="onFname(this.value)" autocomplete="given-name">'
     +'<input class="dp-input" type="email" id="emailIn" placeholder="you@email.com" value="'+S.email.replace(/"/g,"&quot;")+'" oninput="onEmail(this.value)" autocomplete="email" inputmode="email">'
     +'<button class="dp-btn" id="emailBtn" onclick="submitEmail()" '+(formOk()?"":"disabled")+'>Next &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===2){
    h+='<div class="dp-kicker">Step 2 of 4</div>'
     +'<h1 class="dp-h1">The basics</h1>'
     +'<div class="dp-card"><div class="dp-row">'
     +'<p class="dp-label" style="margin:0">Your weight</p>'
     +'<div><span class="dp-weightval" id="wv">'+S.weight+'</span><span style="color:rgba(10,10,10,0.5);font-size:18px;margin-left:4px;font-weight:500">kg</span></div>'
     +'</div>'
     +'<input class="dp-slider" type="range" min="45" max="160" value="'+S.weight+'" oninput="onWeight(this.value)">'
     +'</div>'
     +'<p class="dp-label" style="margin-top:18px">What are you actually after?</p>';
    GOALS.forEach(function(g){
      h+='<div class="dp-opt '+(S.goal===g.id?"on":"")+'" onclick="onGoal(\''+g.id+'\')">'
       +'<div class="ttl">'+g.label+'</div><div class="ds">'+g.sub+'</div></div>';
    });
    h+='<button class="dp-btn" style="margin-top:10px" onclick="go(3)">Next &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===3){
    h+='<div class="dp-kicker">Step 3 of 4</div>'
     +'<h1 class="dp-h1">How\'s your day look?</h1>'
     +'<p class="dp-sub">However you eat now, not how a meal-prep influencer thinks you should.</p>'
     +'<div class="dp-card"><div class="dp-row"><div>'
     +'<p class="dp-label" style="margin:0">Meals</p><div style="color:rgba(10,10,10,0.6);font-size:13px">Proper sit-down feeds</div></div>'
     +'<div class="dp-stepper">'
     +'<button class="dp-stepbtn" onclick="onMeals(-1)">&ndash;</button>'
     +'<span class="dp-stepnum">'+S.meals+'</span>'
     +'<button class="dp-stepbtn" onclick="onMeals(1)">+</button>'
     +'</div></div>';
    S.mealLabels.forEach(function(lbl,i){
      h+='<div class="dp-mealrow"><span class="mt">#'+(i+1)+'</span><div class="dp-segs">';
      MEAL_LABELS.forEach(function(opt){
        h+='<button class="dp-seg '+(lbl===opt?"on":"")+'" onclick="onLabel('+i+',\''+opt+'\')">'+cap(opt)+'</button>';
      });
      h+='</div></div>';
    });
    h+='</div>'
     +'<div class="dp-card"><div class="dp-row"><div>'
     +'<p class="dp-label" style="margin:0">Snacks</p><div style="color:rgba(10,10,10,0.6);font-size:13px">Quick top-ups</div></div>'
     +'<div class="dp-stepper">'
     +'<button class="dp-stepbtn" onclick="onSnacks(-1)">&ndash;</button>'
     +'<span class="dp-stepnum">'+S.snacks+'</span>'
     +'<button class="dp-stepbtn" onclick="onSnacks(1)">+</button>'
     +'</div></div></div>'
     +'<button class="dp-btn" style="margin-top:10px" onclick="go(4)">Next &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===4){
    h+='<div class="dp-kicker">Step 4 of 4</div>'
     +'<h1 class="dp-h1">Anything you don\'t eat?</h1>'
     +'<p class="dp-sub">Tap anything you avoid. Skip it if you eat the lot.</p>'
     +'<div class="dp-pillrow">';
    AVOIDS.forEach(function(a){
      h+='<div class="dp-pill '+(S.avoid.indexOf(a.id)>-1?"on":"")+'" onclick="onAvoid(\''+a.id+'\')">'+a.label+'</div>';
    });
    h+='</div>'
     +'<button class="dp-btn" style="margin-top:24px" onclick="go(5)">See my plan &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===5){
    var tgt=target(), tot=planTotal(), slots=buildSlots();
    var frac=Math.min(tot/tgt,1), offset=RING_C*(1-frac), done=tot>=tgt;
    h+='<div class="dp-kicker">Daily protein target</div>'
     +'<div class="dp-ring-wrap"><div style="position:relative;width:160px;height:160px">'
     +'<svg width="160" height="160" style="display:block">'
     +'<circle cx="80" cy="80" r="'+RING_R+'" fill="none" stroke="rgba(10,10,10,0.1)" stroke-width="10"/>'
     +'<circle id="ringArc" cx="80" cy="80" r="'+RING_R+'" fill="none" stroke="'+LIME+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+RING_C+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 80 80)" style="transition:stroke-dashoffset .4s ease"/>'
     +'</svg>'
     +'<div style="position:absolute;top:0;left:0;width:160px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center">'

     +'<div style="font-family:\'Space Grotesk\';font-weight:600;font-size:13px;color:rgba(10,10,10,0.5);margin-top:4px">of '+tgt+'g</div>'
     +'<div id="ringTick" style="font-size:15px;color:#0a0a0a;margin-top:5px;font-weight:700;display:'+(done?"block":"none")+'">&#10003;</div>'
     +'</div></div></div>'
     +'<p class="dp-ring-status" id="ringStatus" style="color:'+(done?"#0a0a0a":"rgba(10,10,10,0.6)")+'">'
     +(done ? "Target hit. You're sorted." : (tgt-tot)+"g to go. Adjust portions below.")
     +'</p>'
     +'<p class="dp-hint" style="text-align:center;margin-top:-14px">Roughly '+perMeal()+'g per meal'+(S.snacks ? ' and '+perSnack()+'g per snack' : '')+'.</p>'
     +'<p class="dp-label" style="margin-bottom:4px">Pick your protein</p>'
     +'<p class="dp-hint">The serving shows <strong style="color:#0a0a0a">how much food</strong> to eat. The big lime number is <strong style="color:#0a0a0a;background:#D6FF00;padding:0 4px;border-radius:2px">grams of protein</strong> that gives you, not the plate weight. Adjust the sliders to fill your ring.</p>';
    slots.forEach(function(s){
      h+='<div class="dp-pcard"><div class="dp-pcard-top"><div style="min-width:0">'
       +'<div class="slot-lbl">'+s.label+'</div>';
      if(s.food){
        h+='<div class="food-name">'+s.food.name+'</div>'
         +'<div class="serving" id="srv-'+s.key+'">'+fmtAmt(getAmt(s.key,s.food),s.food.amtUnit)+'</div>'
         +'</div>'
         +'<div class="pright"><div class="pnum" id="pn-'+s.key+'">'+getProtein(s.key,s.food)+'g</div>'
         +'<div class="plbl">protein</div></div></div>'
         +'<input class="dp-slider" type="range" min="'+s.food.amtMin+'" max="'+s.food.amtMax+'" step="'+s.food.amtStep+'" value="'+getAmt(s.key,s.food)+'" oninput="onAmt(\''+s.key+'\', this.value)">';
      } else {
        h+='<div class="food-name" style="color:rgba(10,10,10,0.45)">No options. Loosen your filters.</div></div></div>';
      }
      h+='<button class="dp-swap-wide" onclick="onSwap(\''+s.key+'\')">&#8635; Swap protein</button></div>';
    });
    h+='<div class="dp-sec"></div>'
     +'<p class="dp-label" style="margin-bottom:10px">What you could make with this</p>'
     +'<div class="dp-ideas">';
    slots.forEach(function(s){
      if(!s.food) return;
      h+='<div class="dp-idea"><span class="islot">'+s.label+'</span>'
       +'<div class="itext"><span class="iname">'+s.food.name+'</span> &rarr; '+s.food.meals.join(" &middot; ")+'</div></div>';
    });
    h+='</div>'
     +'<div class="dp-sec"></div>'
     +'<p class="dp-label" style="margin-bottom:4px">Your week, mixed up</p>'
     +'<p class="dp-hint">Nobody eats the same thing every day. Pick how much variety you want and your proteins get rotated across the week, each sized to give about the same protein. Your shopping list below matches it.</p>'
     +'<div class="dp-tabs dp-noprint" id="varTabs">'+varietyTabsHTML()+'</div>'
     +'<div class="dp-days dp-noprint"><p class="dp-label" style="margin:0;font-size:17px">Days to plan</p>'
     +'<div class="dp-stepper">'
     +'<button class="dp-stepbtn" aria-label="Fewer days" onclick="onShopDays(-1)">&ndash;</button>'
     +'<span class="dp-stepnum" id="shopDays">'+S.shopDays+'</span>'
     +'<button class="dp-stepbtn" aria-label="More days" onclick="onShopDays(1)">+</button>'
     +'</div></div>'
     +'<div id="weekBox">'+weekHTML()+'</div>'
     +'<p class="dp-label" style="margin-bottom:4px">Your shopping list</p>'
     +'<p class="dp-hint">Everything for the week above. Meat is raw weight, because it shrinks by about a quarter when you cook it.</p>'
     +'<div class="dp-shop" id="shopList">'+shopHTML()+'</div>'
     +'<div class="dp-actions">'
     +'<button class="dp-btn" id="copyBtn" onclick="copyShop()">Copy my week and shopping list</button>'
     +(navigator.share ? '<button class="dp-swap-wide" onclick="shareShop()">Send it to my phone</button>' : '')
     +'</div>'
     +'<div class="dp-sec"></div>'
     +'<p class="dp-label" style="margin-bottom:4px">Best protein sources, ranked</p>'
     +'<div id="rankBox">'+rankedHTML()+'</div>'
     +'<p class="dp-hint" style="font-size:12px">Figures are rough averages for typical Australian products. Brands vary, so check the label.</p>'
     +'<div class="dp-sec"></div>'
     +'<div class="dp-cta"><h3>Protein is one piece of it.</h3>'
     +'<p>If you keep starting and stopping, a better shopping list won\'t fix that. Online coaching gets you a program built around your week, your calories set for your goal, and me checking in every week. $50 a week, no lock-in.</p>'
     +'<a class="dp-btn dark" href="'+COACHING_URL+'">See how online coaching works</a>'
     +'</div>'
     +'<button class="dp-swap-wide" onclick="window.print()" style="margin-top:14px">Save or print my plan</button>'
     +'<button class="dp-ghost" onclick="restart()" style="display:block;margin:10px auto 0">&#8635; Start over</button>'
     +'<p class="dp-fine">General guidance for healthy adults, not medical or dietary advice. If you have a health condition, check with your GP or a dietitian.</p>';
  }

  app.innerHTML = h;
}

/* ---------- handlers (partial updates where it matters) ---------- */
function emailOk(){ return S.email.indexOf("@")>-1 && S.email.indexOf(".")>-1; }
function formOk(){ return emailOk() && S.fname.trim().length>0; }
function gateEmailBtn(){
  var b=document.getElementById("emailBtn");
  if(b){ if(formOk()) b.removeAttribute("disabled"); else b.setAttribute("disabled","disabled"); }
}
function onEmail(v){ S.email=v; gateEmailBtn(); }
function onFname(v){ S.fname=v; gateEmailBtn(); }
function onWeight(v){
  S.weight=Number(v);
  var el=document.getElementById("wv"); if(el) el.textContent=S.weight;
}
function onGoal(id){ S.goal=id; render(); }
function onMeals(d){ S.meals=Math.min(5,Math.max(2,S.meals+d)); syncMealLabels(); render(); }
function onSnacks(d){ S.snacks=Math.min(3,Math.max(0,S.snacks+d)); render(); }
function onLabel(i,lbl){ S.mealLabels[i]=lbl; render(); }
function onAvoid(id){
  var ix=S.avoid.indexOf(id);
  if(ix>-1) S.avoid.splice(ix,1); else S.avoid.push(id);
  render();
}
function onSwap(key){
  S.swaps[key]=(S.swaps[key]||0)+1;
  delete S.amounts[key];
  render();
}
function onAmt(key, v){
  S.amounts[key]=Number(v);
  // partial update: serving text, protein number, ring — no re-render mid-drag
  var slots=buildSlots();
  var s=slots.filter(function(x){return x.key===key;})[0];
  if(s && s.food){
    var srv=document.getElementById("srv-"+key), pn=document.getElementById("pn-"+key);
    if(srv) srv.textContent=fmtAmt(getAmt(key,s.food), s.food.amtUnit);
    if(pn)  pn.textContent=getProtein(key,s.food)+"g";
  }
  updateRing();
  refreshShop();
}
function updateRing(){
  var tgt=target(), tot=planTotal(), done=tot>=tgt;
  var frac=Math.min(tot/tgt,1);
  var arc=document.getElementById("ringArc"), num=document.getElementById("ringNum"),
      tick=document.getElementById("ringTick"), st=document.getElementById("ringStatus");
  if(arc){
    arc.setAttribute("stroke-dashoffset", RING_C*(1-frac));
    arc.style.filter = "none";
  }
  if(num){ num.textContent=tot+"g"; num.style.color = "#0a0a0a"; }
  if(tick) tick.style.display = done ? "block" : "none";
  if(st){
    st.style.color = done ? "#0a0a0a" : "rgba(10,10,10,0.6)";
    st.innerHTML = done ? "Target hit. You're sorted." : (tgt-tot)+"g to go. Adjust portions below.";
  }
}

render();
</script>
