<script>

var COACHING_URL = "https://www.deansweetpt.com";

/* ========================================================= */
var LIME = "#D6FF00";
var RING_R = 68, RING_C = 2 * Math.PI * RING_R;

var PROTEINS = [

  {name:"Big Greek yoghurt",  baseAmt:350,amtUnit:"g",       amtMin:150,amtMax:600,amtStep:50, protein:35, slot:"breakfast", tags:["dairy"],          meals:["Yoghurt, berries + granola","Smoothie bowl"]},
  {name:"Smoked salmon + egg",baseAmt:1,  amtUnit:"servings",amtMin:1,  amtMax:3,  amtStep:1,  protein:28, slot:"breakfast", tags:["seafood","egg"],  meals:["On toast","Bagel + cream cheese"]},
  {name:"Eggs",               baseAmt:4,  amtUnit:"eggs",    amtMin:1,  amtMax:8,  amtStep:1,  protein:24, slot:"breakfast", tags:["egg"],            meals:["Scramble on toast","Omelette + veg","Fry-up with beans"]},
  {name:"Cottage cheese",     baseAmt:200,amtUnit:"g",       amtMin:50, amtMax:500,amtStep:50, protein:22, slot:"breakfast", tags:["dairy"],          meals:["On toast + tomato","Stirred through oats"]},
  {name:"Tofu",               baseAmt:200,amtUnit:"g",       amtMin:100,amtMax:400,amtStep:50, protein:22, slot:"breakfast", tags:["plant"],          meals:["Tofu scramble + toast","Tofu + avo on toast"]},
  // MAINS
  {name:"Prawns",             baseAmt:200,amtUnit:"g",   amtMin:100,amtMax:400,amtStep:25, protein:48, slot:"main", tags:["seafood"],      meals:["Prawn stir-fry + rice","Prawn pasta","Prawn tacos"]},
  {name:"Chicken breast",     baseAmt:150,amtUnit:"g",   amtMin:75, amtMax:300,amtStep:25, protein:46, slot:"main", tags:["meat"],         meals:["Chicken, rice + veg","Big chicken salad","Burrito bowl"]},
  {name:"Pork loin",          baseAmt:150,amtUnit:"g",   amtMin:75, amtMax:300,amtStep:25, protein:46, slot:"main", tags:["meat"],         meals:["Pork, veg + spuds","Pork stir-fry"]},
  {name:"Tinned tuna",        baseAmt:2,  amtUnit:"tins",amtMin:1,  amtMax:4,  amtStep:1,  protein:46, slot:"main", tags:["seafood"],      meals:["Tuna pasta bake","Tuna salad","Tuna + rice bowl"]},
  {name:"Turkey mince",       baseAmt:150,amtUnit:"g",   amtMin:75, amtMax:300,amtStep:25, protein:44, slot:"main", tags:["meat"],         meals:["Turkey bolognese","San choy bau"]},
  {name:"White fish",         baseAmt:200,amtUnit:"g",   amtMin:100,amtMax:400,amtStep:25, protein:42, slot:"main", tags:["seafood"],      meals:["Fish, chips + salad","Fish tacos"]},
  {name:"Lean beef mince",    baseAmt:150,amtUnit:"g",   amtMin:75, amtMax:300,amtStep:25, protein:40, slot:"main", tags:["meat","red"],   meals:["Bolognese","Burrito bowl","Cottage pie"]},
  {name:"Steak",              baseAmt:150,amtUnit:"g",   amtMin:75, amtMax:300,amtStep:25, protein:40, slot:"main", tags:["meat","red"],   meals:["Steak, spuds + greens","Steak salad"]},
  {name:"Salmon fillet",      baseAmt:150,amtUnit:"g",   amtMin:75, amtMax:300,amtStep:25, protein:37, slot:"main", tags:["seafood"],      meals:["Salmon, potato + greens","Poke bowl"]},
  {name:"Omelette + cheese",  baseAmt:4,  amtUnit:"eggs",amtMin:2,  amtMax:8,  amtStep:1,  protein:32, slot:"main", tags:["egg","dairy"],  meals:["Loaded omelette + side salad"]},
  {name:"Tofu",               baseAmt:250,amtUnit:"g",   amtMin:100,amtMax:500,amtStep:50, protein:28, slot:"main", tags:["plant"],        meals:["Tofu stir-fry + rice","Tofu curry"]},
  {name:"Lentils + chickpeas",baseAmt:1.5,amtUnit:"cups",amtMin:0.5,amtMax:4,  amtStep:0.5,protein:25, slot:"main", tags:["plant"],        meals:["Lentil curry + rice","Chickpea bowl"]},
  // SNACKS
  {name:"Protein shake",    baseAmt:1,  amtUnit:"scoops",amtMin:1,  amtMax:3,  amtStep:1,  protein:25, slot:"snack", tags:["dairy"],       meals:["Just shake it","Blended with milk + banana"]},
  {name:"Tin of tuna",      baseAmt:1,  amtUnit:"tins",  amtMin:1,  amtMax:3,  amtStep:1,  protein:23, slot:"snack", tags:["seafood"],     meals:["On crackers","Tuna + cucumber"]},
  {name:"Greek yoghurt",    baseAmt:200,amtUnit:"g",     amtMin:100,amtMax:400,amtStep:50, protein:20, slot:"snack", tags:["dairy"],       meals:["With berries","With honey + nuts"]},
  {name:"Protein bar",      baseAmt:1,  amtUnit:"bars",  amtMin:1,  amtMax:3,  amtStep:1,  protein:20, slot:"snack", tags:["convenient"],  meals:["Straight up"]},
  {name:"Ham + cheese",     baseAmt:100,amtUnit:"g",     amtMin:50, amtMax:200,amtStep:25, protein:18, slot:"snack", tags:["meat","dairy"],meals:["Roll-ups","On crackers"]},
  {name:"Cottage cheese",   baseAmt:150,amtUnit:"g",     amtMin:75, amtMax:300,amtStep:25, protein:17, slot:"snack", tags:["dairy"],       meals:["With crackers","With fruit"]},
  {name:"Edamame",          baseAmt:1,  amtUnit:"cups",  amtMin:0.5,amtMax:3,  amtStep:0.5,protein:17, slot:"snack", tags:["plant"],       meals:["Steamed + salt"]},
  {name:"Roasted chickpeas",baseAmt:1,  amtUnit:"cups",  amtMin:0.5,amtMax:3,  amtStep:0.5,protein:15, slot:"snack", tags:["plant"],       meals:["Straight up"]},
  {name:"Beef jerky",       baseAmt:40, amtUnit:"g",     amtMin:20, amtMax:120,amtStep:20, protein:14, slot:"snack", tags:["meat","red"],  meals:["Straight up"]},
  {name:"Boiled eggs",      baseAmt:2,  amtUnit:"eggs",  amtMin:1,  amtMax:6,  amtStep:1,  protein:12, slot:"snack", tags:["egg"],         meals:["With salt","Egg + mayo"]}
];

var GOALS = [
  {id:"enough", label:"Just eat enough",       sub:"Stop running on empty",    mult:1.6},
  {id:"fatloss",label:"Lose fat, keep muscle", sub:"The one most people want", mult:2.0},
  {id:"muscle", label:"Build muscle",          sub:"Actually put size on",     mult:2.2}
];
var AVOIDS = [
  {id:"red",    label:"No red meat"},
  {id:"meat",   label:"No meat at all"},
  {id:"seafood",label:"No seafood"},
  {id:"dairy",  label:"No dairy"},
  {id:"egg",    label:"No eggs"}
];
function dropsFood(avoidId, f){
  if(avoidId==="red")     return f.tags.indexOf("red")>-1;
  if(avoidId==="meat")    return f.tags.indexOf("meat")>-1;
  if(avoidId==="seafood") return f.tags.indexOf("seafood")>-1;
  if(avoidId==="dairy")   return f.tags.indexOf("dairy")>-1;
  if(avoidId==="egg")     return f.tags.indexOf("egg")>-1;
  return false;
}
var MEAL_LABELS = ["breakfast","lunch","dinner"];

var S = {
  step:0, fname:"", email:"", weight:80, goal:"fatloss",
  meals:3, snacks:1, mealLabels:["breakfast","lunch","dinner"],
  avoid:[], swaps:{}, amounts:{}
};

function round5(n){ return Math.round(n/5)*5; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function defaultLabel(i,n){ return i===0 ? "breakfast" : (i===n-1 ? "dinner" : "lunch"); }
function poolFor(label){ return label==="breakfast" ? "breakfast" : "main"; }
function fmtAmt(amt, unit){
  if(unit==="g") return amt+"g";
  var sing = {eggs:"egg",scoops:"scoop",cups:"cup",tins:"tin",bars:"bar",servings:"serving"};
  return amt+" "+(amt===1 && sing[unit] ? sing[unit] : unit);
}
function target(){ var g=GOALS.filter(function(x){return x.id===S.goal;})[0]; return round5(S.weight*g.mult); }
function perMeal(){ return round5(target()/(S.meals + S.snacks*0.5)); }
function perSnack(){ return round5(perMeal()*0.5); }
function allowed(){
  return PROTEINS.filter(function(f){
    return !S.avoid.some(function(a){ return dropsFood(a,f); });
  });
}
function optBy(slotType, aim){
  return allowed().filter(function(f){ return f.slot===slotType; })
    .sort(function(a,b){ return Math.abs(a.protein-aim)-Math.abs(b.protein-aim); });
}
function pickFood(key, opts, idx){
  if(!opts.length) return null;
  return opts[(idx + (S.swaps[key]||0)) % opts.length];
}
function buildSlots(){
  var out=[], i, bf=optBy("breakfast",perMeal()), mn=optBy("main",perMeal()), sk=optBy("snack",perSnack());
  for(i=0;i<S.meals;i++){
    var label = S.mealLabels[i] || defaultLabel(i,S.meals);
    var opts = poolFor(label)==="breakfast" ? bf : mn;
    out.push({key:"meal-"+i, label:cap(label), food:pickFood("meal-"+i, opts, i)});
  }
  for(i=0;i<S.snacks;i++){
    out.push({key:"snack-"+i, label:"Snack "+(i+1), food:pickFood("snack-"+i, sk, i)});
  }
  return out;
}
function getAmt(key, food){ return S.amounts[key]!==undefined ? S.amounts[key] : food.baseAmt; }
function getProtein(key, food){ return Math.round(getAmt(key,food)*food.protein/food.baseAmt); }
function planTotal(){
  return buildSlots().reduce(function(sum,s){ return s.food ? sum+getProtein(s.key,s.food) : sum; },0);
}
function syncMealLabels(){
  var arr=[], i;
  for(i=0;i<S.meals;i++) arr.push(S.mealLabels[i] || defaultLabel(i,S.meals));
  S.mealLabels = arr;
}

/* ---------- email submit (MailerLite or no-op) ---------- */
function submitEmail(){
  if(!ML_FORM_ACTION){ go(2); return; }
  var fd = new FormData();
  fd.append("fields[email]", S.email);
  fd.append("fields[name]", S.fname);
  fd.append("ml-submit", "1");
  fd.append("anticsrf", "true");
  fetch(ML_FORM_ACTION, {method:"POST", body:fd, mode:"no-cors"})
    .catch(function(){ /* don't block the tool if capture fails */ })
    .finally(function(){ go(2); });
}

/* ---------- render ---------- */
function go(n){ S.step=n; render(); window.scrollTo(0,0); }
function back(){ go(Math.max(0,S.step-1)); }
function restart(){ S.step=0; S.swaps={}; S.amounts={}; render(); window.scrollTo(0,0); }

function progDots(){
  if(S.step<1 || S.step>4) return "";
  var h='<div class="dp-prog">';
  [1,2,3,4].forEach(function(n){ h+='<span class="'+(S.step>=n?"on":"")+'"></span>'; });
  return h+"</div>";
}

function render(){
  var app=document.getElementById("app"), h=progDots();

  if(S.step===0){
    h+='<div class="dp-kicker">No fluff &middot; 60 seconds</div>'
     +'<h1 class="dp-h1">How much protein do you <em>actually</em> need?</h1>'
     +'<p class="dp-sub">No app to download. No calorie tracking for the rest of your life. Just your number, proteins to hit it, and meal ideas built around them. Adjust portions with the slider. Swap anything you don\'t like.</p>'
     +'<button class="dp-btn" onclick="go(1)">Build my protein plan &rarr;</button>';
  }

  else if(S.step===1){
    h+='<div class="dp-kicker">Step 1 of 4</div>'
     +'<h1 class="dp-h1">Where do we send it?</h1>'
     +'<p class="dp-sub">Pop your email in and I\'ll build your plan now &mdash; then send you a few no-BS ways to actually hit your number day to day.</p>'
     +'<input class="dp-input" type="text" id="fnameIn" placeholder="First name" value="'+S.fname.replace(/"/g,"&quot;")+'" oninput="onFname(this.value)" autocomplete="given-name">'
     +'<input class="dp-input" type="email" id="emailIn" placeholder="you@email.com" value="'+S.email.replace(/"/g,"&quot;")+'" oninput="onEmail(this.value)" autocomplete="email" inputmode="email">'
     +'<button class="dp-btn" id="emailBtn" onclick="submitEmail()" '+(formOk()?"":"disabled")+'>Next &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===2){
    h+='<div class="dp-kicker">Step 2 of 4</div>'
     +'<h1 class="dp-h1">The basics</h1>'
     +'<div class="dp-card"><div class="dp-row">'
     +'<p class="dp-label" style="margin:0">Your weight</p>'
     +'<div><span class="dp-weightval" id="wv">'+S.weight+'</span><span style="color:#888;font-size:18px;margin-left:4px">kg</span></div>'
     +'</div>'
     +'<input class="dp-slider" type="range" min="45" max="160" value="'+S.weight+'" oninput="onWeight(this.value)">'
     +'</div>'
     +'<p class="dp-label" style="margin-top:18px">What are you actually after?</p>';
    GOALS.forEach(function(g){
      h+='<div class="dp-opt '+(S.goal===g.id?"on":"")+'" onclick="onGoal(\''+g.id+'\')">'
       +'<div class="ttl">'+g.label+'</div><div class="ds">'+g.sub+'</div></div>';
    });
    h+='<button class="dp-btn" style="margin-top:10px" onclick="go(3)">Next &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===3){
    h+='<div class="dp-kicker">Step 3 of 4</div>'
     +'<h1 class="dp-h1">How\'s your day look?</h1>'
     +'<p class="dp-sub">However you actually eat &mdash; not how a meal-prep influencer thinks you should.</p>'
     +'<div class="dp-card"><div class="dp-row"><div>'
     +'<p class="dp-label" style="margin:0">Meals</p><div style="color:#888;font-size:13px">Proper sit-down feeds</div></div>'
     +'<div class="dp-stepper">'
     +'<button class="dp-stepbtn" onclick="onMeals(-1)">&ndash;</button>'
     +'<span class="dp-stepnum">'+S.meals+'</span>'
     +'<button class="dp-stepbtn" onclick="onMeals(1)">+</button>'
     +'</div></div>';
    S.mealLabels.forEach(function(lbl,i){
      h+='<div class="dp-mealrow"><span class="mt">#'+(i+1)+'</span><div class="dp-segs">';
      MEAL_LABELS.forEach(function(opt){
        h+='<button class="dp-seg '+(lbl===opt?"on":"")+'" onclick="onLabel('+i+',\''+opt+'\')">'+cap(opt)+'</button>';
      });
      h+='</div></div>';
    });
    h+='</div>'
     +'<div class="dp-card"><div class="dp-row"><div>'
     +'<p class="dp-label" style="margin:0">Snacks</p><div style="color:#888;font-size:13px">Quick top-ups</div></div>'
     +'<div class="dp-stepper">'
     +'<button class="dp-stepbtn" onclick="onSnacks(-1)">&ndash;</button>'
     +'<span class="dp-stepnum">'+S.snacks+'</span>'
     +'<button class="dp-stepbtn" onclick="onSnacks(1)">+</button>'
     +'</div></div></div>'
     +'<button class="dp-btn" style="margin-top:10px" onclick="go(4)">Next &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===4){
    h+='<div class="dp-kicker">Step 4 of 4</div>'
     +'<h1 class="dp-h1">Anything you don\'t eat?</h1>'
     +'<p class="dp-sub">Tap anything you avoid. Skip it if you eat the lot.</p>'
     +'<div class="dp-pillrow">';
    AVOIDS.forEach(function(a){
      h+='<div class="dp-pill '+(S.avoid.indexOf(a.id)>-1?"on":"")+'" onclick="onAvoid(\''+a.id+'\')">'+a.label+'</div>';
    });
    h+='</div>'
     +'<button class="dp-btn" style="margin-top:24px" onclick="go(5)">See my plan &rarr;</button>'
     +'<button class="dp-ghost" onclick="back()">&larr; Back</button>';
  }

  else if(S.step===5){
    var tgt=target(), tot=planTotal(), slots=buildSlots();
    var frac=Math.min(tot/tgt,1), offset=RING_C*(1-frac), done=tot>=tgt;
    h+='<div class="dp-kicker">Daily protein target</div>'
     +'<div class="dp-ring-wrap"><div style="position:relative;width:160px;height:160px">'
     +'<svg width="160" height="160" style="display:block">'
     +'<circle cx="80" cy="80" r="'+RING_R+'" fill="none" stroke="#1e1e1e" stroke-width="10"/>'
     +'<circle id="ringArc" cx="80" cy="80" r="'+RING_R+'" fill="none" stroke="'+LIME+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+RING_C+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 80 80)" style="transition:stroke-dashoffset .4s ease;filter:drop-shadow(0 0 '+(done?10:4)+'px '+LIME+(done?"":"60")+')"/>'
     +'</svg>'
     +'<div style="position:absolute;top:0;left:0;width:160px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center">'
     +'<div id="ringNum" style="font-family:\'Bebas Neue\';font-size:36px;color:'+(done?LIME:"#fff")+';line-height:1;transition:color .4s">'+tot+'g</div>'
     +'<div style="font-family:\'Bebas Neue\';font-size:14px;color:#555;margin-top:3px">of '+tgt+'g</div>'
     +'<div id="ringTick" style="font-size:16px;color:'+LIME+';margin-top:5px;display:'+(done?"block":"none")+'">&#10003;</div>'
     +'</div></div></div>'
     +'<p class="dp-ring-status" id="ringStatus" style="color:'+(done?LIME:"#9a9a9a")+'">'
     +(done ? "Target hit. You're sorted." : (tgt-tot)+"g to go &mdash; adjust portions below")
     +'</p>'
     +'<p class="dp-label" style="margin-bottom:4px">Pick your protein</p>'
     +'<p class="dp-hint">The serving shows <strong style="color:#fff">how much food</strong> to eat. The big lime number is <strong style="color:'+LIME+'">grams of protein</strong> that gives you &mdash; not the plate weight. Adjust the sliders to fill your ring.</p>';
    slots.forEach(function(s){
      h+='<div class="dp-pcard"><div class="dp-pcard-top"><div style="min-width:0">'
       +'<div class="slot-lbl">'+s.label+'</div>';
      if(s.food){
        h+='<div class="food-name">'+s.food.name+'</div>'
         +'<div class="serving" id="srv-'+s.key+'">'+fmtAmt(getAmt(s.key,s.food),s.food.amtUnit)+'</div>'
         +'</div>'
         +'<div class="pright"><div class="pnum" id="pn-'+s.key+'">'+getProtein(s.key,s.food)+'g</div>'
         +'<div class="plbl">protein</div></div></div>'
         +'<input class="dp-slider" type="range" min="'+s.food.amtMin+'" max="'+s.food.amtMax+'" step="'+s.food.amtStep+'" value="'+getAmt(s.key,s.food)+'" oninput="onAmt(\''+s.key+'\', this.value)">';
      } else {
        h+='<div class="food-name" style="color:#555">No options &mdash; loosen filters</div></div></div>';
      }
      h+='<button class="dp-swap-wide" onclick="onSwap(\''+s.key+'\')">&#8635; Swap protein</button></div>';
    });
    h+='<div class="dp-sec"></div>'
     +'<p class="dp-label" style="margin-bottom:10px">What you could make with this</p>'
     +'<div class="dp-ideas">';
    slots.forEach(function(s){
      if(!s.food) return;
      h+='<div class="dp-idea"><span class="islot">'+s.label+'</span>'
       +'<div class="itext"><span class="iname">'+s.food.name+'</span> &rarr; '+s.food.meals.join(" &middot; ")+'</div></div>';
    });
    h+='</div>'
     +'<div class="dp-cta"><h3>This is the easy part.</h3>'
     +'<p>Hitting your protein is one piece. If you\'ve started and stopped a hundred times, the problem was never you &mdash; it was a plan that didn\'t fit your life. That\'s the bit I fix.</p>'
     +'<a class="dp-btn" href="'+COACHING_URL+'">Show me what working together looks like &rarr;</a>'
     +'</div>'
     +'<button class="dp-ghost" onclick="restart()" style="display:block;margin:10px auto 0">&#8635; Start over</button>'
     +'<p class="dp-fine">General guidance for healthy adults &mdash; not medical or dietary advice. If you have a health condition, check with your GP or a dietitian.</p>';
  }

  app.innerHTML = h;
}

/* ---------- handlers (partial updates where it matters) ---------- */
function emailOk(){ return S.email.indexOf("@")>-1 && S.email.indexOf(".")>-1; }
function formOk(){ return emailOk() && S.fname.trim().length>0; }
function gateEmailBtn(){
  var b=document.getElementById("emailBtn");
  if(b){ if(formOk()) b.removeAttribute("disabled"); else b.setAttribute("disabled","disabled"); }
}
function onEmail(v){ S.email=v; gateEmailBtn(); }
function onFname(v){ S.fname=v; gateEmailBtn(); }
function onWeight(v){
  S.weight=Number(v);
  var el=document.getElementById("wv"); if(el) el.textContent=S.weight;
}
function onGoal(id){ S.goal=id; render(); }
function onMeals(d){ S.meals=Math.min(5,Math.max(2,S.meals+d)); syncMealLabels(); render(); }
function onSnacks(d){ S.snacks=Math.min(3,Math.max(0,S.snacks+d)); render(); }
function onLabel(i,lbl){ S.mealLabels[i]=lbl; render(); }
function onAvoid(id){
  var ix=S.avoid.indexOf(id);
  if(ix>-1) S.avoid.splice(ix,1); else S.avoid.push(id);
  render();
}
function onSwap(key){
  S.swaps[key]=(S.swaps[key]||0)+1;
  delete S.amounts[key];
  render();
}
function onAmt(key, v){
  S.amounts[key]=Number(v);
  // partial update: serving text, protein number, ring — no re-render mid-drag
  var slots=buildSlots();
  var s=slots.filter(function(x){return x.key===key;})[0];
  if(s && s.food){
    var srv=document.getElementById("srv-"+key), pn=document.getElementById("pn-"+key);
    if(srv) srv.textContent=fmtAmt(getAmt(key,s.food), s.food.amtUnit);
    if(pn)  pn.textContent=getProtein(key,s.food)+"g";
  }
  updateRing();
}
function updateRing(){
  var tgt=target(), tot=planTotal(), done=tot>=tgt;
  var frac=Math.min(tot/tgt,1);
  var arc=document.getElementById("ringArc"), num=document.getElementById("ringNum"),
      tick=document.getElementById("ringTick"), st=document.getElementById("ringStatus");
  if(arc){
    arc.setAttribute("stroke-dashoffset", RING_C*(1-frac));
    arc.style.filter = done ? "drop-shadow(0 0 10px "+LIME+")" : "drop-shadow(0 0 4px "+LIME+"60)";
  }
  if(num){ num.textContent=tot+"g"; num.style.color = done ? LIME : "#fff"; }
  if(tick) tick.style.display = done ? "block" : "none";
  if(st){
    st.style.color = done ? LIME : "#9a9a9a";
    st.innerHTML = done ? "Target hit. You're sorted." : (tgt-tot)+"g to go &mdash; adjust portions below";
  }
}

render();
</script>
</body>
</html>
